<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agenda App</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#007bff">
</head>

<body>

  <h3 id="resumenHoy"></h3>

  <!-- INPUT -->
  <div>
    <input type="text" id="inputTarea" placeholder="¿Qué no quieres olvidar?">
    
    <div>
      <button onclick="setHoy()">Hoy</button>
      <button onclick="setManana()">Mañana</button>
    </div>

    <input type="date" id="inputFecha">
    <button id="btnAgregar">Añadir</button>
  </div>

  <!-- LISTAS -->
  <h2>Hoy</h2>
  <ul id="listaHoy"></ul>

  <h2>Mañana</h2>
  <ul id="listaManana"></ul>
  <div id="verMasMananaContainer"></div>

  <h2>Próximos</h2>
  <ul id="listaProximos"></ul>
  <div id="verMasContainer"></div>

  <script type="module" src="app.js"></script>

</body>
</html>
